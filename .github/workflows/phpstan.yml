name: Analyze PHP code with PHPStan

on:
  push:
  pull_request:

jobs:
  build:
    name: Analyze PHP code with PHPStan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.0"

    steps:
      - uses: actions/checkout@v2

      - name: Set up PHP 8.0 environment
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}

      - name: Install PHPStan dependencies
        run: composer install

      - name: Run PHPStan at maximum level
        run: ./vendor/bin/phpstan analyse -c phpstan.neon
