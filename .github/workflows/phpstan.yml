name: Analyze PHP code with PHPStan

on:
  push:
  pull_request:

jobs:
  build:
    name: Analyze PHP code with PHPStan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php:
          - "8.0"

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up PHP 8.0 environment
        uses: shivammathur/setup-php@73aede52cb368fb5bfc2956c593eb40704b51cca
        with:
          php-version: ${{ matrix.php }}

      - name: Install PHPStan dependencies
        run: composer install

      - name: Run PHPStan at maximum level
        run: ./vendor/bin/phpstan analyse -c phpstan.neon
