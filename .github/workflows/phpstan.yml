name: Analyze PHP code with PHPStan

on:
  push:
  pull_request:

jobs:
  build:
    name: Analyze PHP code with PHPStan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP 8.0 environment
        uses: shivammathur/setup-php@daf6ef8034382aea2c4e1521ead10758419b02cf
        with:
          php-version: ${{ matrix.php }}

      - name: Install PHPStan dependencies
        run: composer install

      - name: Run PHPStan at maximum level
        run: ./vendor/bin/phpstan analyse -c phpstan.neon
