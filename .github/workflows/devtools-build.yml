name: Build libMCUnicodeChars virion PHAR with DevTools
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: AxolotlBucketLabs/DevTools/.github/workflows/build-plugin.yml@04fd726101109739bf1fd629dbe8499d3e2864bb # v3
    with:
      type: virion
      phpstan: off
      php-version: '8.4'
      pm-version-major: '5'
      artifact-name: libMCUnicodeChars-virion-${{ github.sha }}

